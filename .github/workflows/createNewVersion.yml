name: Create new version

on:
  workflow_dispatch:
    inputs:
      SEMVER_LEVEL:
        description: One of {BUILD, PATCH, MINOR, MAJOR}
        required: true
        default: BUILD
        type: string

  workflow_call:
    inputs:
      SEMVER_LEVEL:
        description: One of {BUILD, PATCH, MINOR, MAJOR}
        required: false
        default: BUILD
        type: string

    outputs:
      NEW_VERSION:
        description: The new version string
        value: ${{ jobs.createNewVersion.outputs.NEW_VERSION }}

jobs:
  createNewVersion:
    runs-on: ubuntu-latest
    outputs:
      NEW_VERSION: ${{ steps.bumpVersion.outputs.NEW_VERSION }}
    steps:
      - name: Run turnstyle
        uses: softprops/turnstyle@49108bdfa571e62371bd2c3094893c547ab3fc03
        with:
          poll-interval-seconds: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check out
        # v4
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          ref: main
          submodules: true
          token: ${{ github.token }}

      - name: Configure git
        run: |
          git config user.name "OSBotify"
          git config user.email "osbotify@users.noreply.github.com"
          cd Mobile-Expensify
          git config user.name "OSBotify"
          git config user.email "osbotify@users.noreply.github.com"
          # Remove the checkout action's credential header so our PAT takes effect
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin https://x-access-token:${{ secrets.ME_PAT }}@github.com/LukasMod/Mobile-Expensify.git

      - name: Bump version
        id: bumpVersion
        run: |
          CURRENT_VERSION=$(jq -r .version package.json)
          LEVEL="${{ inputs.SEMVER_LEVEL }}"

          # Parse version: MAJOR.MINOR.PATCH-BUILD
          IFS='.-' read -r MAJOR MINOR PATCH BUILD <<< "$CURRENT_VERSION"
          BUILD=${BUILD:-0}

          case "$LEVEL" in
            BUILD)  BUILD=$((BUILD + 1)) ;;
            PATCH)  PATCH=$((PATCH + 1)); BUILD=0 ;;
            MINOR)  MINOR=$((MINOR + 1)); PATCH=0; BUILD=0 ;;
            MAJOR)  MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0; BUILD=0 ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}-${BUILD}"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::Bumping $CURRENT_VERSION -> $NEW_VERSION (level: $LEVEL)"

          # Update package.json (only file that matters for the checklist)
          npm --no-git-tag-version version "$NEW_VERSION"

      - name: Commit new Mobile-Expensify version
        working-directory: Mobile-Expensify
        run: |
          NEW_VERSION="${{ steps.bumpVersion.outputs.NEW_VERSION }}"
          jq --arg v "$NEW_VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          git add package.json
          git commit -m "Update version to $NEW_VERSION"
          DETACHED_COMMIT=$(git rev-parse HEAD)
          git checkout main && git pull origin main
          git cherry-pick "$DETACHED_COMMIT"
          git push origin main

      - name: Commit new E/App version
        run: |
          git add package.json package-lock.json
          git commit -m "Update version to ${{ steps.bumpVersion.outputs.NEW_VERSION }}"

      - name: Update Mobile-Expensify submodule in E/App
        run: |
          git add Mobile-Expensify
          git commit -m "Update Mobile-Expensify submodule version to ${{ steps.bumpVersion.outputs.NEW_VERSION }}"
          git push origin main
