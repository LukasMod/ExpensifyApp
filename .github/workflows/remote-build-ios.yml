name: Remote Build iOS

on:
  workflow_dispatch:
    inputs:
      mobile_expensify_pr:
        description: "Mobile-Expensify PR number to use for hybrid build"
        required: false
        type: string
  push:
    branches-ignore: [staging, production, cherry-pick-*]
    paths-ignore:
      [
        "docs/**",
        "contributingGuides/**",
        "help/**",
        ".github/**",
        "scripts/**",
        "tests/**",
      ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ${{ github.repository_owner == 'Expensify' && 'macos-15-xlarge' || 'macos-15' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: "New Expensify Dev"
            configuration: "DebugDevelopment"
            is_hybrid_build: false

          # - scheme: 'Expensify Dev'
          #   configuration: 'Debug'
          #   is_hybrid_build: true
    steps:
      - name: Checkout
        # v4
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          submodules: ${{ matrix.is_hybrid_build || false }}
          token: ${{ secrets.OS_BOTIFY_TOKEN }}

      - name: Setup Node
        uses: ./.github/actions/composite/setupNode
        with:
          IS_HYBRID_BUILD: ${{ matrix.is_hybrid_build && 'true' || 'false' }}

      - name: Rock Remote Build - iOS
        # rock v3 - using fork with extra fingerprint check
        uses: LukasMod/ios@34eb3b86b7a568a60204628adbed0983a74c87e8
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IS_HYBRID_APP: ${{ matrix.is_hybrid_build }}
          # Forces React Native to build from source to include our custom patches
          RCT_USE_RN_DEP: 0
          RCT_USE_PREBUILT_RNCORE: 0
        with:
          destination: simulator
          scheme: ${{ matrix.scheme }}
          configuration: ${{ matrix.configuration }}
          comment-bot: false
